name: Flight Price Check

on:
  schedule:
    # UTC 01:00 / 13:00 = 台灣時間 09:00 / 21:00（每日兩次）
    - cron: "0 1,13 * * *"
  workflow_dispatch: # 可在 GitHub 網頁上手動觸發

jobs:
  check-price:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download settings from Gist
        # 讀取 LINE 對話設定的最新版（Gist 公開 raw URL）
        # 沒有設定時略過，main.py 自動回退 config.yaml
        run: |
          if [ -z "$SETTINGS_URL" ]; then
            echo "⚠️ 未設定 SETTINGS_GIST_RAW_URL，本次將改用 config.yaml 的預設值"
            exit 0
          fi
          # 自動去除釘住的 revision，改抓 Gist 最新版本
          CLEAN_URL=$(echo "$SETTINGS_URL" | sed -E 's#/raw/[0-9a-f]{7,40}/#/raw/#; s#/raw/[0-9a-f]{7,40}$#/raw/settings.json#')
          if [ "$CLEAN_URL" != "$SETTINGS_URL" ]; then
            echo "⚠️ 網址含 revision SHA（Gist 更新後不會生效），已自動改用最新版："
            echo "    $CLEAN_URL"
            echo "    建議把 Actions secret SETTINGS_GIST_RAW_URL 改成上面這行"
            SETTINGS_URL="$CLEAN_URL"
          else
            echo "✅ 網址為 Gist 最新版本格式（不含 SHA）"
          fi
          if curl -fsSL "$SETTINGS_URL" -o settings.json; then
            echo "✅ 下載成功，本次實際使用的 LINE 設定如下："
            cat settings.json
          else
            echo "❌ 下載失敗（404 表示網址／檔名／公開權限有問題），改用 config.yaml"
            rm -f settings.json
          fi
        env:
          SETTINGS_URL: ${{ secrets.SETTINGS_GIST_RAW_URL }}

      - name: Run flight price check
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python main.py
