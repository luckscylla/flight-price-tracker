name: Flight Price Check

on:
  schedule:
    # UTC 01:00 / 13:00 = 台灣時間 09:00 / 21:00（每日兩次）
    - cron: "0 1,13 * * *"
  workflow_dispatch: # 可在 GitHub 網頁上手動觸發

jobs:
  check-price:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download settings from Gist
        # 讀取 LINE 對話設定的最新版（Gist 公開 raw URL）
        # 沒有設定時略過，main.py 自動回退 config.yaml
        run: |
          if [ -n "$SETTINGS_URL" ]; then
            curl -fsSL "$SETTINGS_URL" -o settings.json || echo "下載設定失敗，改用 config.yaml"
          fi
        env:
          SETTINGS_URL: ${{ secrets.SETTINGS_GIST_RAW_URL }}

      - name: Run flight price check
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python main.py
